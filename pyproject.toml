[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jazi-browser"
version = "0.1.0"
description = "Jazi Browser (Linux) — a browser purpose-built for AI agents. Isolated Spaces, Chrome login inheritance, JS-based page control."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "playwright>=1.45.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
jazi = "jazi_browser.cli:main"
